<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة سومة للوحات المميزة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --saudi-green: #006C35;
            --saudi-green-dark: #004d25;
            --saudi-green-light: #e6f3ed;
            --saudi-gold: #c5a059;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            margin: 0;
            padding: 0;
        }

        #interactive-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(
                circle 900px at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(0, 77, 37, 0.15) 0%,
                rgba(0, 40, 15, 0.05) 50%,
                transparent 100%
            );
            transition: background 0.1s ease-out;
        }

        .creative-logo {
            mix-blend-mode: multiply;
            filter: contrast(1.2) brightness(1.02);
            background: transparent !important;
        }

        .saudi-plate-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 5px 0;
        }

        .saudi-plate-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }

        .saudi-plate {
            background-color: #ffffff;
            border: 3px solid #1e293b;
            border-radius: 14px;
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.18);
            position: relative;
            aspect-ratio: 520 / 145;
            width: 100%;
            color: #0f172a;
            font-weight: bold;
            overflow: hidden;
            user-select: none;
        }

        .plate-border-inner {
            border: 2px solid #1e293b;
            margin: 4px;
            border-radius: 9px;
            height: calc(100% - 8px);
            display: flex;
            position: relative;
            background-color: #ffffff;
        }

        .plate-section-ksa-side {
            width: 7.5%;
            border-left: 2px solid #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 3px 1px;
            background-color: #ffffff;
            color: #0f172a;
        }

        .plate-section-ksa-side.side-private {
            background-color: #ffffff;
            color: #0f172a;
        }
        .plate-section-ksa-side.side-transport-private {
            background-color: #2563eb;
            color: #ffffff;
        }
        .plate-section-ksa-side.side-transport-public {
            background-color: #eab308;
            color: #000000;
        }

        .plate-section-right-letters {
            width: 34.5%;
            display: flex;
            flex-direction: column;
            border-left: 2px solid #1e293b;
        }

        .plate-section-center-logo {
            width: 22%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            border-left: 2px solid #1e293b;
        }

        .plate-section-left-numbers {
            width: 36%;
            display: flex;
            flex-direction: column;
        }

        .plate-half-top {
            height: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #1e293b;
            overflow: hidden;
        }

        .plate-half-bottom {
            height: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .plate-grid-container {
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
            width: 100%;
            height: 100%;
            direction: rtl;
            padding: 0 2px;
        }

        .plate-grid-container-num {
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
            width: 100%;
            height: 100%;
            direction: ltr;
            padding: 0 2px;
        }

        .plate-text-ar {
            font-size: clamp(2.4rem, 9.5vw, 4.8rem);
            line-height: 1;
            font-family: 'Amiri', serif;
            text-align: center;
            font-weight: 700;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .plate-text-en {
            font-size: clamp(2.1rem, 8.5vw, 4.2rem);
            line-height: 1;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            font-weight: 900;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .type-pill {
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
            font-size: 0.75rem;
            font-weight: 700;
            color: #334155;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .type-pill:hover, .type-pill.active {
            border-color: var(--saudi-green);
            background-color: var(--saudi-green);
            color: #ffffff;
            box-shadow: 0 3px 8px rgba(0, 108, 53, 0.2);
        }

        .sold-stamp {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-12deg) scale(0.8);
            border: 4px double #dc2626;
            color: #dc2626;
            background-color: rgba(255, 255, 255, 0.96);
            padding: 4px 20px;
            font-size: clamp(1.4rem, 4vw, 3.8rem);
            font-weight: 900;
            border-radius: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            box-shadow: 0 10px 25px rgba(220, 38, 38, 0.35);
            z-index: 30;
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .sold-stamp.active {
            opacity: 1;
            transform: translate(-50%, -50%) rotate(-12deg) scale(1);
        }
    </style>
</head>
<body class="py-4 px-2 md:px-8 flex flex-col justify-between items-center">

    <div id="interactive-bg"></div>

    <main class="w-full max-w-[1400px] flex-1 space-y-4 relative z-10">

        <div class="flex justify-end w-full px-1">
            <button onclick="toggleFullScreen()" title="ملء الشاشة" class="w-10 h-10 bg-white/90 hover:bg-emerald-50 text-emerald-900 rounded-xl border border-slate-200 flex items-center justify-center transition active:scale-95 shadow-sm">
                <i data-lucide="maximize" class="w-5 h-5"></i>
            </button>
        </div>

        <section class="text-center relative py-1 space-y-3">
            <!-- تكبير الشعار ليصل لدرجة العرض والارتفاع المطلوبة داخل الإطار الأحمر -->
            <div class="flex flex-col items-center justify-center my-2">
                <img src="soma-logo.png" alt="شعار منصة سومة" class="h-44 md:h-72 w-auto max-w-[85vw] object-contain creative-logo">
            </div>
            
            <div class="saudi-plate-wrapper">
                <div class="saudi-plate-container">
                    
                    <div id="soldStamp" class="sold-stamp">تم البيع</div>

                    <div class="saudi-plate flex flex-col">
                        <div class="plate-border-inner">
                            
                            <div id="ksaSideBar" class="plate-section-ksa-side side-private">
                                <div class="w-3.5 h-3.5 md:w-6 md:h-6 mx-auto mt-0.5 flex items-center justify-center">
                                    <img src="اسود.png" alt="الشعار" class="w-full h-full object-contain">
                                </div>
                                
                                <div class="text-[7px] md:text-[11px] font-black text-center leading-none my-0.5 font-['Tajawal'] text-slate-900 whitespace-nowrap">
                                    السعودية
                                </div>

                                <div class="text-[10px] md:text-[16px] font-black tracking-widest flex flex-col items-center leading-tight mb-0.5 text-slate-900">
                                    <span>K</span>
                                    <span>S</span>
                                    <span>A</span>
                                </div>
                            </div>

                            <div class="plate-section-right-letters">
                                <div class="plate-half-top">
                                    <div id="displayLettersAr" class="plate-grid-container"></div>
                                </div>
                                <div class="plate-half-bottom">
                                    <div id="displayLettersEn" class="plate-grid-container"></div>
                                </div>
                            </div>

                            <div class="plate-section-center-logo">
                                <div class="w-full h-full flex items-center justify-center p-0.5">
                                    <img src="logo.png" alt="الشعار الرئيسي" class="w-full h-full object-contain">
                                </div>
                            </div>

                            <div class="plate-section-left-numbers">
                                <div class="plate-half-top">
                                    <div id="displayNumAr" class="plate-grid-container-num"></div>
                                </div>
                                <div class="plate-half-bottom">
                                    <div id="displayNumEn" class="plate-grid-container-num"></div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <!-- كافة أدوات التحكم تحت اللوحة مباشرة وبدون أي خلفية مربعة -->
            <div class="pt-2 space-y-3 max-w-md mx-auto">
                <!-- اختيار نوع اللوحة -->
                <div class="flex flex-wrap justify-center items-center gap-1.5">
                    <button onclick="selectPlateType('private')" class="type-pill active" id="type-private">خصوصي</button>
                    <button onclick="selectPlateType('transport-private')" class="type-pill" id="type-transport-private">نقل خاص</button>
                    <button onclick="selectPlateType('transport-public')" class="type-pill" id="type-transport-public">نقل عام</button>
                </div>

                <!-- خيارات تعديل اللوحة -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-emerald-900/90 text-center mb-0.5">الحروف</label>
                        <input type="text" id="inputLettersAr" value="أ ب ح" oninput="handleArabicLettersInput()" placeholder="مثال: أ ب ح" class="w-full bg-white/80 border border-slate-300 rounded-lg px-2 py-1 text-center font-bold text-slate-800 focus:outline-none focus:border-emerald-600 text-xs shadow-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-emerald-900/90 text-center mb-0.5">الأرقام</label>
                        <input type="text" id="inputNumAr" value="١ ١ ١" oninput="handleArabicNumbersInput()" placeholder="مثال: ١ ١ ١" class="w-full bg-white/80 border border-slate-300 rounded-lg px-2 py-1 text-center font-bold text-slate-800 focus:outline-none focus:border-emerald-600 text-xs shadow-sm">
                    </div>
                </div>

                <!-- خيارات الوقت وحالة المزاد مصغرة ومباشرة بدون خلفية -->
                <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-200/60">
                    <!-- المؤقت -->
                    <div class="flex flex-col items-center justify-center space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-bold text-emerald-900/90">المزاد:</span>
                            <span id="timerDisplay" class="text-sm font-black text-slate-900">00:00</span>
                        </div>
                        <div class="flex items-center gap-1 w-full">
                            <button onclick="startTimer()" class="bg-emerald-700 text-white px-1.5 py-0.5 rounded text-[10px] font-bold hover:bg-emerald-800 transition flex-1">بدء</button>
                            <button onclick="stopTimer()" class="bg-slate-200 text-slate-800 px-1.5 py-0.5 rounded text-[10px] font-bold hover:bg-slate-300 transition flex-1">إيقاف</button>
                            <button onclick="resetTimer()" class="bg-slate-200 text-slate-800 px-1.5 py-0.5 rounded text-[10px] font-bold hover:bg-slate-300 transition flex-1">تصفير</button>
                        </div>
                    </div>

                    <!-- حالة اللوحة (تم البيع) -->
                    <div class="flex flex-col items-center justify-center space-y-1">
                        <span class="text-[10px] font-bold text-emerald-900/90 mb-0.5">حالة اللوحة</span>
                        <button onclick="toggleSoldStatus()" id="soldBtn" class="w-full py-1 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-lg text-[10px] transition flex items-center justify-center gap-1 shadow-sm active:scale-95">
                            <i data-lucide="shield-alert" class="w-3 h-3"></i>
                            <span>تم البيع</span>
                        </button>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <footer class="mt-4 text-center text-xs text-emerald-900 font-extrabold relative z-10 pb-4">
        منصة سومة لبيع اللوحات المميزة - إصدار البث المباشر 🇸🇦
    </footer>

    <script>
        lucide.createIcons();

        window.addEventListener('mousemove', (e) => {
            const x = `${e.clientX}px`;
            const y = `${e.clientY}px`;
            document.getElementById('interactive-bg').style.setProperty('--mouse-x', x);
            document.getElementById('interactive-bg').style.setProperty('--mouse-y', y);
        });

        const validLetterMap = {
            'أ': 'A', 'ا': 'A', 'إ': 'A', 'آ': 'A',
            'ب': 'B',
            'ح': 'J',
            'د': 'D',
            'ر': 'R',
            'س': 'S',
            'ص': 'X',
            'ط': 'T',
            'ع': 'E',
            'ق': 'G',
            'ك': 'K',
            'ل': 'L',
            'م': 'Z',
            'ن': 'N',
            'هـ': 'H', 'ه': 'H',
            'و': 'U',
            'ى': 'V', 'ي': 'V'
        };

        const numMap = {
            '٠': { ar: '٠', en: '0' }, '0': { ar: '٠', en: '0' },
            '١': { ar: '١', en: '1' }, '1': { ar: '١', en: '1' },
            '٢': { ar: '٢', en: '2' }, '2': { ar: '٢', en: '2' },
            '٣': { ar: '٣', en: '3' }, '3': { ar: '٣', en: '3' },
            '٤': { ar: '٤', en: '4' }, '4': { ar: '٤', en: '4' },
            '٥': { ar: '٥', en: '5' }, '5': { ar: '٥', en: '5' },
            '٦': { ar: '٦', en: '6' }, '6': { ar: '٦', en: '6' },
            '٧': { ar: '٧', en: '7' }, '7': { ar: '٧', en: '7' },
            '٨': { ar: '٨', en: '8' }, '8': { ar: '٨', en: '8' },
            '٩': { ar: '٩', en: '9' }, '9': { ar: '٩', en: '9' }
        };

        function handleArabicLettersInput() {
            const inputField = document.getElementById('inputLettersAr');
            const rawVal = inputField.value;
            const charsAr = [];
            const charsEn = [];

            for (let char of rawVal) {
                if (char === ' ') continue;
                if (validLetterMap[char]) {
                    charsAr.push(char);
                    charsEn.push(validLetterMap[char]);
                }
            }

            const arContainer = document.getElementById('displayLettersAr');
            arContainer.innerHTML = '';
            (charsAr.length > 0 ? charsAr : ['أ', 'ب', 'ح']).forEach(ch => {
                const span = document.createElement('span');
                span.className = 'plate-text-ar';
                span.innerText = ch;
                arContainer.appendChild(span);
            });

            const enContainer = document.getElementById('displayLettersEn');
            enContainer.innerHTML = '';
            (charsEn.length > 0 ? charsEn : ['A', 'B', 'J']).forEach(ch => {
                const span = document.createElement('span');
                span.className = 'plate-text-en';
                span.innerText = ch;
                enContainer.appendChild(span);
            });
        }

        function handleArabicNumbersInput() {
            const rawVal = document.getElementById('inputNumAr').value;
            const numsAr = [];
            const numsEn = [];

            for (let char of rawVal) {
                if (char === ' ') continue;
                if (numMap[char] !== undefined) {
                    numsAr.push(numMap[char].ar);
                    numsEn.push(numMap[char].en);
                }
            }

            const arContainer = document.getElementById('displayNumAr');
            arContainer.innerHTML = '';
            (numsAr.length > 0 ? numsAr : ['١', '١', '١']).forEach(num => {
                const span = document.createElement('span');
                span.className = 'plate-text-ar';
                span.innerText = num;
                arContainer.appendChild(span);
            });

            const enContainer = document.getElementById('displayNumEn');
            enContainer.innerHTML = '';
            (numsEn.length > 0 ? numsEn : ['1', '1', '1']).forEach(num => {
                const span = document.createElement('span');
                span.className = 'plate-text-en';
                span.innerText = num;
                enContainer.appendChild(span);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            handleArabicLettersInput();
            handleArabicNumbersInput();
        });

        function selectPlateType(typeKey) {
            document.querySelectorAll('.type-pill').forEach(btn => btn.classList.remove('active'));
            const selectedBtn = document.getElementById('type-' + typeKey);
            if (selectedBtn) selectedBtn.classList.add('active');

            const sideBar = document.getElementById('ksaSideBar');
            sideBar.className = 'plate-section-ksa-side side-' + typeKey;
        }

        let isSold = false;
        function toggleSoldStatus() {
            isSold = !isSold;
            const stamp = document.getElementById('soldStamp');
            const btn = document.getElementById('soldBtn');
            
            if (isSold) {
                stamp.classList.add('active');
                btn.classList.replace('bg-rose-600', 'bg-emerald-600');
                btn.classList.replace('hover:bg-rose-700', 'hover:bg-emerald-700');
                btn.querySelector('span').innerText = 'إلغاء البيع';
            } else {
                stamp.classList.remove('active');
                btn.classList.remove('bg-emerald-600', 'bg-rose-600');
                btn.classList.add('bg-rose-600');
                btn.querySelector('span').innerText = 'تم البيع';
            }
        }

        let timerInterval = null;
        let seconds = 0;

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
                const secs = String(seconds % 60).padStart(2, '0');
                document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function resetTimer() {
            stopTimer();
            seconds = 0;
            document.getElementById('timerDisplay').innerText = "00:00";
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
