<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة سومة للوحات المميزة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --saudi-green: #006C35;
            --saudi-green-dark: #004d25;
            --saudi-green-light: #e6f3ed;
            --saudi-gold: #c5a059;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            margin: 0;
            padding: 0;
        }

        #interactive-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(
                circle 900px at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(0, 77, 37, 0.15) 0%,
                rgba(0, 40, 15, 0.05) 50%,
                transparent 100%
            );
            transition: background 0.1s ease-out;
        }

        .creative-logo {
            mix-blend-mode: multiply;
            filter: contrast(1.2) brightness(1.02);
            background: transparent !important;
        }

        .saudi-plate-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 10px 0;
        }

        .saudi-plate-container {
            position: relative;
            width: 100%;
            max-width: 820px; 
            margin: 0 auto;
        }

        .saudi-plate {
            background-color: #ffffff;
            border: 4px solid #1e293b;
            border-radius: 18px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            aspect-ratio: 520 / 145;
            width: 100%;
            color: #0f172a;
            font-weight: bold;
            overflow: hidden;
            user-select: none;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .saudi-plate:focus {
            border-color: #006C35;
            box-shadow: 0 0 0 5px rgba(0, 108, 53, 0.25), 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .plate-border-inner {
            border: 2.5px solid #1e293b;
            margin: 5px;
            border-radius: 12px;
            height: calc(100% - 10px);
            display: flex;
            position: relative;
            background-color: #ffffff;
        }

        .plate-section-ksa-side {
            width: 7.5%;
            border-left: 2.5px solid #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 4px 1px;
            background-color: #ffffff;
            color: #0f172a;
        }

        .plate-section-ksa-side.side-private {
            background-color: #ffffff;
            color: #0f172a;
        }
        .plate-section-ksa-side.side-transport-private {
            background-color: #2563eb;
            color: #ffffff;
        }
        .plate-section-ksa-side.side-transport-public {
            background-color: #eab308;
            color: #000000;
        }

        .plate-section-right-letters {
            width: 34.5%;
            display: flex;
            flex-direction: column;
            border-left: 2.5px solid #1e293b;
            transition: width 0.3s ease;
        }

        .plate-section-center-logo {
            width: 22%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            border-left: 2.5px solid #1e293b;
            transition: all 0.3s ease;
        }

        .plate-section-center-logo.hidden {
            display: none !important;
        }

        .plate-section-left-numbers {
            width: 36%;
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
        }

        .plate-half-top {
            height: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2.5px solid #1e293b;
            overflow: hidden;
            position: relative;
        }

        .plate-half-bottom {
            height: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .plate-grid-container {
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
            width: 100%;
            height: 100%;
            direction: rtl;
            padding: 0 2px;
        }

        .plate-grid-container-num {
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
            width: 100%;
            height: 100%;
            direction: ltr;
            padding: 0 2px;
        }

        /* تعديل احترافي لضبط جميع الحروف العربية وسحبها للمنتصف تماماً */
        .plate-text-ar {
            font-size: clamp(2.4rem, 9.5vw, 4.8rem);
            line-height: 0.8;
            font-family: 'Amiri', serif;
            text-align: center;
            font-weight: 700;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            transform: translateY(-5%); /* رفعة خفيفة لتوسيط ذيل الحروف مثل (ح) في المنتصف تماماً */
        }

        .plate-text-en {
            font-size: clamp(2.4rem, 9.5vw, 4.8rem);
            line-height: 1;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            font-weight: 900;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .type-pill {
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
            font-size: 0.7rem;
            font-weight: 700;
            color: #334155;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .type-pill:hover, .type-pill.active {
            border-color: var(--saudi-green);
            background-color: var(--saudi-green);
            color: #ffffff;
            box-shadow: 0 3px 8px rgba(0, 108, 53, 0.2);
        }

        .logo-pill {
            width: 38px;
            height: 38px;
            padding: 4px;
            border-radius: 10px;
            border: 1.5px solid #cbd5e1;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .logo-pill:hover, .logo-pill.active {
            border-color: var(--saudi-green);
            background-color: var(--saudi-green-light);
            box-shadow: 0 3px 8px rgba(0, 108, 53, 0.2);
            transform: translateY(-1px);
        }

        .logo-pill img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .sold-stamp {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-12deg) scale(0.8);
            border: 4px double #dc2626;
            color: #dc2626;
            background-color: rgba(255, 255, 255, 0.96);
            padding: 6px 24px;
            font-size: clamp(1.8rem, 5vw, 4.8rem);
            font-weight: 900;
            border-radius: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            box-shadow: 0 10px 25px rgba(220, 38, 38, 0.35);
            z-index: 30;
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .sold-stamp.active {
            opacity: 1;
            transform: translate(-50%, -50%) rotate(-12deg) scale(1);
        }
    </style>
</head>
<body class="py-4 px-2 md:px-8 flex flex-col justify-between items-center">

    <div id="interactive-bg"></div>

    <main class="w-full max-w-[1400px] flex-1 space-y-4 relative z-10 flex flex-col items-center">

        <div class="flex justify-end w-full px-1 max-w-2xl">
            <button onclick="toggleFullScreen()" title="ملء الشاشة" class="w-10 h-10 bg-white/90 hover:bg-emerald-50 text-emerald-900 rounded-xl border border-slate-200 flex items-center justify-center transition active:scale-95 shadow-sm">
                <i data-lucide="maximize" class="w-5 h-5"></i>
            </button>
        </div>

        <section class="text-center relative py-1 space-y-3 w-full">
            <div class="flex flex-col items-center justify-center my-1">
                <img src="soma-logo.png" alt="شعار منصة سومة" class="h-32 md:h-48 w-auto max-w-[85vw] object-contain creative-logo">
            </div>
            
            <div class="saudi-plate-wrapper">
                <div class="saudi-plate-container">
                    
                    <div id="soldStamp" class="sold-stamp">تم البيع</div>

                    <!-- اللوحة الكبيرة قابلة للضغط والكتابة المباشرة -->
                    <div id="mainPlate" tabindex="0" class="saudi-plate flex flex-col" title="اضغط هنا للكتابة المباشرة">
                        <div class="plate-border-inner">
                            
                            <div id="ksaSideBar" class="plate-section-ksa-side side-private">
                                <div class="w-4 h-4 md:w-8 md:h-8 mx-auto mt-0.5 flex items-center justify-center">
                                    <img src="اسود.png" alt="الشعار" class="w-full h-full object-contain">
                                </div>
                                
                                <div class="text-[9px] md:text-[14px] font-black text-center leading-none my-0.5 font-['Tajawal'] text-slate-900 whitespace-nowrap">
                                    السعودية
                                </div>

                                <div class="text-[12px] md:text-[22px] font-black tracking-widest flex flex-col items-center leading-tight mb-0.5 text-slate-900">
                                    <span>K</span>
                                    <span>S</span>
                                    <span>A</span>
                                </div>
                            </div>

                            <div id="rightLettersSection" class="plate-section-right-letters">
                                <div class="plate-half-top">
                                    <div id="displayLettersAr" class="plate-grid-container"></div>
                                </div>
                                <div class="plate-half-bottom">
                                    <div id="displayLettersEn" class="plate-grid-container"></div>
                                </div>
                            </div>

                            <!-- الشعار الأوسط المتركز -->
                            <div id="centerLogoSection" class="plate-section-center-logo">
                                <div class="w-full h-full flex items-center justify-center p-0.5">
                                    <img id="centerLogoImg" src="logo.png" alt="الشعار الرئيسي" class="w-full h-full object-contain transition-transform duration-200">
                                </div>
                            </div>

                            <div id="leftNumbersSection" class="plate-section-left-numbers">
                                <div class="plate-half-top">
                                    <div id="displayNumAr" class="plate-grid-container-num"></div>
                                </div>
                                <div class="plate-half-bottom">
                                    <div id="displayNumEn" class="plate-grid-container-num"></div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <!-- أدوات التحكم تحت اللوحة -->
            <div class="pt-2 space-y-3 max-w-md mx-auto">
                
                <!-- اختيار نوع اللوحة -->
                <div class="flex flex-col items-center gap-1">
                    <span class="text-[10px] font-bold text-emerald-900/90">نوع اللوحة</span>
                    <div class="flex flex-wrap justify-center items-center gap-1.5">
                        <button onclick="selectPlateType('private')" class="type-pill active" id="type-private">خصوصي</button>
                        <button onclick="selectPlateType('transport-private')" class="type-pill" id="type-transport-private">نقل خاص</button>
                        <button onclick="selectPlateType('transport-public')" class="type-pill" id="type-transport-public">نقل عام</button>
                    </div>
                </div>

                <!-- خانة اختيار الشعارات -->
                <div class="flex flex-col items-center gap-1.5 pt-1 border-t border-slate-200/60">
                    <div class="relative w-full flex items-center justify-center my-0.5">
                        <div class="absolute inset-0 flex items-center" aria-hidden="true">
                            <div class="w-full border-t border-emerald-900/25"></div>
                        </div>
                        <span class="relative px-3 bg-[#f8fafc] text-[11px] font-black text-emerald-900 tracking-wider shadow-sm rounded-full border border-emerald-900/15 py-0.5">شعارات</span>
                    </div>
                    
                    <div class="flex flex-wrap justify-center items-center gap-2">
                        <button onclick="changeCenterLogo('logo.png', 'swords')" class="logo-pill active" id="logo-swords" title="السيفين والنخلة ملون">
                            <img src="logo.png" alt="ملون">
                        </button>
                        <button onclick="changeCenterLogo('سيفين اسود.png', 'swords-black')" class="logo-pill" id="logo-swords-black" title="السيفين والنخلة أسود">
                            <img src="سيفين اسود.png" alt="أسود">
                        </button>
                        <button onclick="changeCenterLogo('رؤيه.png', 'vision')" class="logo-pill" id="logo-vision" title="رؤية 2030">
                            <img src="رؤيه.png" alt="الرؤية">
                        </button>
                        <button onclick="changeCenterLogo('الدرعية.png', 'diriyah')" class="logo-pill" id="logo-diriyah" title="الدرعية">
                            <img src="الدرعية.png" alt="الدرعية">
                        </button>
                        <button onclick="changeCenterLogo('الحجر.png', 'hegra')" class="logo-pill" id="logo-hegra" title="الحجر">
                            <img src="الحجر.png" alt="الحجر">
                        </button>
                    </div>
                </div>

                <!-- خيارات الوقت وحالة المزاد -->
                <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-200/60">
                    <!-- المؤقت -->
                    <div class="flex flex-col items-center justify-center space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-bold text-emerald-900/90">المزاد:</span>
                            <span id="timerDisplay" class="text-sm font-black text-slate-900">00:00</span>
                        </div>
                        <div class="flex items-center gap-1 w-full">
                            <button onclick="startTimer()" class="bg-emerald-700 text-white px-1.5 py-0.5 rounded text-[10px] font-bold hover:bg-emerald-800 transition flex-1">بدء</button>
                            <button onclick="stopTimer()" class="bg-slate-200 text-slate-800 px-1.5 py-0.5 rounded text-[10px] font-bold hover:bg-slate-300 transition flex-1">إيقاف</button>
                            <button onclick="resetTimer()" class="bg-slate-200 text-slate-800 px-1.5 py-0.5 rounded text-[10px] font-bold hover:bg-slate-300 transition flex-1">تصفير</button>
                        </div>
                    </div>

                    <!-- حالة اللوحة -->
                    <div class="flex flex-col items-center justify-center space-y-1">
                        <span class="text-[10px] font-bold text-emerald-900/90 mb-0.5">حالة اللوحة</span>
                        <button onclick="toggleSoldStatus()" id="soldBtn" class="w-full py-1 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-lg text-[10px] transition flex items-center justify-center gap-1 shadow-sm active:scale-95">
                            <i data-lucide="shield-alert" class="w-3 h-3"></i>
                            <span>تم البيع</span>
                        </button>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <footer class="mt-4 text-center text-xs text-emerald-900 font-extrabold relative z-10 pb-4">
        منصة سومة لبيع اللوحات المميزة - إصدار البث المباشر 🇸🇦
    </footer>

    <script>
        lucide.createIcons();

        window.addEventListener('mousemove', (e) => {
            const x = `${e.clientX}px`;
            const y = `${e.clientY}px`;
            document.getElementById('interactive-bg').style.setProperty('--mouse-x', x);
            document.getElementById('interactive-bg').style.setProperty('--mouse-y', y);
        });

        const validLetterMap = {
            'أ': 'A', 'ا': 'A', 'إ': 'A', 'آ': 'A',
            'ب': 'B',
            'ح': 'J',
            'د': 'D',
            'ر': 'R',
            'س': 'S',
            'ص': 'X',
            'ط': 'T',
            'ع': 'E',
            'ق': 'G',
            'ك': 'K',
            'ل': 'L',
            'م': 'Z',
            'ن': 'N',
            'هـ': 'H', 'ه': 'H',
            'و': 'U',
            'ى': 'V', 'ي': 'V'
        };

        const numMap = {
            '٠': { ar: '٠', en: '0' }, '0': { ar: '٠', en: '0' },
            '١': { ar: '١', en: '1' }, '1': { ar: '١', en: '1' },
            '٢': { ar: '٢', en: '2' }, '2': { ar: '٢', en: '2' },
            '٣': { ar: '٣', en: '3' }, '3': { ar: '٣', en: '3' },
            '٤': { ar: '٤', en: '4' }, '4': { ar: '٤', en: '4' },
            '٥': { ar: '٥', en: '5' }, '5': { ar: '٥', en: '5' },
            '٦': { ar: '٦', en: '6' }, '6': { ar: '٦', en: '6' },
            '٧': { ar: '٧', en: '7' }, '7': { ar: '٧', en: '7' },
            '٨': { ar: '٨', en: '8' }, '8': { ar: '٨', en: '8' },
            '٩': { ar: '٩', en: '9' }, '9': { ar: '٩', en: '9' }
        };

        let currentLetters = ['أ', 'ب', 'ح'];
        let currentNums = ['١', '١', '١'];

        function updatePlateDisplay() {
            const arContainer = document.getElementById('displayLettersAr');
            const enContainer = document.getElementById('displayLettersEn');
            arContainer.innerHTML = '';
            enContainer.innerHTML = '';

            currentLetters.forEach(ch => {
                const spanAr = document.createElement('span');
                spanAr.className = 'plate-text-ar';
                spanAr.innerText = ch;
                arContainer.appendChild(spanAr);

                const spanEn = document.createElement('span');
                spanEn.className = 'plate-text-en';
                spanEn.innerText = validLetterMap[ch] || 'A';
                enContainer.appendChild(spanEn);
            });

            const arNumContainer = document.getElementById('displayNumAr');
            const enNumContainer = document.getElementById('displayNumEn');
            arNumContainer.innerHTML = '';
            enNumContainer.innerHTML = '';

            currentNums.forEach(num => {
                const mapObj = numMap[num] || { ar: '١', en: '1' };
                
                const spanAr = document.createElement('span');
                spanAr.className = 'plate-text-ar';
                spanAr.innerText = mapObj.ar;
                arNumContainer.appendChild(spanAr);

                const spanEn = document.createElement('span');
                spanEn.className = 'plate-text-en';
                spanEn.innerText = mapObj.en;
                enNumContainer.appendChild(spanEn);
            });
        }

        const mainPlate = document.getElementById('mainPlate');

        mainPlate.addEventListener('keydown', (e) => {
            const key = e.key;

            if (key === 'Backspace') {
                e.preventDefault();
                if (currentNums.length > 0) {
                    currentNums.pop();
                } else if (currentLetters.length > 0) {
                    currentLetters.pop();
                }
                updatePlateDisplay();
                return;
            }

            if (validLetterMap[key]) {
                e.preventDefault();
                if (currentLetters.length < 3) {
                    currentLetters.push(key);
                    updatePlateDisplay();
                }
                return;
            }

            if (numMap[key] !== undefined) {
                e.preventDefault();
                if (currentNums.length < 4) {
                    currentNums.push(key);
                    updatePlateDisplay();
                }
                return;
            }
        });

        function changeCenterLogo(logoPath, key) {
            const img = document.getElementById('centerLogoImg');
            img.src = logoPath;
            
            if (key === 'swords-black') {
                img.style.transform = 'scale(0.65)';
            } else {
                img.style.transform = 'scale(1)';
            }

            document.querySelectorAll('.logo-pill').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('logo-' + key);
            if (activeBtn) activeBtn.classList.add('active');
        }

        function selectPlateType(typeKey) {
            document.querySelectorAll('.type-pill').forEach(btn => btn.classList.remove('active'));
            const selectedBtn = document.getElementById('type-' + typeKey);
            if (selectedBtn) selectedBtn.classList.add('active');

            const sideBar = document.getElementById('ksaSideBar');
            sideBar.className = 'plate-section-ksa-side side-' + typeKey;

            const centerLogo = document.getElementById('centerLogoSection');
            const rightLetters = document.getElementById('rightLettersSection');
            const leftNumbers = document.getElementById('leftNumbersSection');

            if (typeKey === 'transport-private' || typeKey === 'transport-public') {
                centerLogo.classList.add('hidden');
                rightLetters.style.width = '48%';
                leftNumbers.style.width = '44.5%';
            } else {
                centerLogo.classList.remove('hidden');
                rightLetters.style.width = '34.5%';
                leftNumbers.style.width = '36%';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            updatePlateDisplay();
        });

        let isSold = false;
        function toggleSoldStatus() {
            isSold = !isSold;
            const stamp = document.getElementById('soldStamp');
            const btn = document.getElementById('soldBtn');
            
            if (isSold) {
                stamp.classList.add('active');
                btn.classList.replace('bg-rose-600', 'bg-emerald-600');
                btn.classList.replace('hover:bg-rose-700', 'hover:bg-emerald-700');
                btn.querySelector('span').innerText = 'إلغاء البيع';
            } else {
                stamp.classList.remove('active');
                btn.classList.remove('bg-emerald-600', 'bg-rose-600');
                btn.classList.add('bg-rose-600');
                btn.querySelector('span').innerText = 'تم البيع';
            }
        }

        let timerInterval = null;
        let seconds = 0;

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
                const secs = String(seconds % 60).padStart(2, '0');
                document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function resetTimer() {
            stopTimer();
            seconds = 0;
            document.getElementById('timerDisplay').innerText = "00:00";
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
